  ATLAS_EP_PROTOCOL: "v2"
  ATLAS_RDMA_ALLREDUCE: "1"
  ATLAS_RDMA_ONESHOT: "1"
  ATLAS_RDMA_PAIR_CHAIN: "1"
  ATLAS_GLM_CMD_RDMA: "1"
  ATLAS_QWEN4EXP_DECODE_GRAPH: "1"
