  # Ours (2026-10-24): the API-level "spinning" detector counts short assistant turns in the history and
  # bans <tool_call> once it sees 8 of them. Voice chats (Home Assistant) are all short turns, so it fired
  # and Atlas returned one-word replies with no tool call. This keeps the detector but stops the ban.
  ATLAS_LOOP_NO_SUPPRESS: "1"
  ATLAS_CONTENT_LOOP_WATCHDOG: "1"
  ATLAS_CONTENT_LOOP_MIN_REPEATS: "32"
  ATLAS_LOOP_STEER: "1"
