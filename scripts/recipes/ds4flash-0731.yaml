description: vLLM serving DeepSeek-V4-Flash-0731 on 2x DGX Spark
model: deepseek-ai/DeepSeek-V4-Flash-0731
container: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
mods: []
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 524288
  max_num_batched_tokens: 12288
  max_num_seqs: 64
  block_size: 256
  num_speculative_tokens: 3
env:
  DG_JIT_USE_NVRTC: '0'
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: '1'
  VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --pipeline-parallel-size 1 \
      --kv-cache-dtype nvfp4_ds_mla \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-cudagraph-capture-size 24 \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --moe-backend flashinfer_b12x \
      --attention-backend FLASHINFER_MLA_SPARSE_DSV4 \
      --async-scheduling \
      --no-scheduler-reserve-full-isl \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic"}}' \
      --enable-chunked-prefill \
      --tokenizer-mode deepseek_v4 \
      --distributed-executor-backend ray \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
      --generation-config vllm \
      --enable-flashinfer-autotune \
      --load-format auto
recipe_version: '1'
name: DeepSeek-V4-Flash-0731
cluster_only: true
