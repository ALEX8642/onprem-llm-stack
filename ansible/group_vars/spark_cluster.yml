---
# Cluster-wide variables

# NFS server (NAS)
nfs_server: "nas"
# Note: you need to add a models share in NAS first.
# NAS UI → Shares → Add Share → name: "models", primary storage: cache (SSD)
# Then add NFS export: Settings → NFS → Export /mnt/user/models
# NOTE 2026-09-26: this export went stale on both nodes ("Stale file handle"); NAS now exports
# /mnt/user/Models to the Sparks instead. Confirm the right share before running the nfs role.
nfs_models_export: "/mnt/user/Media/models"
nfs_models_mount: "/mnt/models"

# Ports
port_litellm: 4000
port_openwebui: 3001
port_searxng: 8888
port_chatterbox: 8004
port_comfyui: 8188
port_glances: 61208

# Model ports (sparkrun, external to Docker)
port_coding: 8002       # MiniMax M2.7 NVFP4
port_reasoning: 8003    # Qwen3.5-122B FP8
port_fallback: 8001     # GPT-OSS-120B

# Model control API (host-level, head only) — see docs/STATUS.md
port_model_control: 9091

# Stack location
stack_dir: "/home/ai/ai-stack"

# LiteLLM master key: read from the environment, never committed
litellm_master_key: "{{ lookup('env', 'LITELLM_MASTER_KEY') }}"
